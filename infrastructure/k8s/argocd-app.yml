apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: exodia-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/iltifatyousuf/actis-exodia.git'
    targetRevision: main
    path: infrastructure/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: exodia-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
