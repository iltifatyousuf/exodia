apiVersion: apps/v1
kind: Deployment
metadata:
  name: exodia-ai-engine
  namespace: exodia-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: exodia-ai
  template:
    metadata:
      labels:
        app: exodia-ai
    spec:
      containers:
      - name: ai-engine
        image: exodia/ai-engine:latest
        ports:
        - containerPort: 8000
        env:
        - name: KAFKA_BROKER
          value: "kafka-cluster.exodia-prod.svc.cluster.local:9092"
        - name: REDIS_HOST
          value: "redis-cache.exodia-prod.svc.cluster.local"
